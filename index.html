<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Client-side geometry-controlled infant hip ultrasound editing research demonstration.">
  <title>Hip ultrasound editing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Hip ultrasound editing</h1><a href="https://github.com/YuehpengChen/hip-ultrasound-editing" target="_blank" rel="noopener">GitHub</a></header>
<main>
  <section class="import-bar" aria-label="Load image">
    <button id="choose-image" type="button">Upload image</button><input id="upload" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    <div id="examples" class="examples"></div>
  </section>
  <div class="layout">
    <section class="workspace" aria-label="Image workspace">
      <div class="image-grid">
        <figure><figcaption><b>Source</b><span id="source-size"></span></figcaption><div class="canvas-wrap"><canvas id="source" width="256" height="256" aria-label="Source image" tabindex="0"></canvas></div></figure>
        <figure><figcaption><b>Edited</b><span id="result-state"></span></figcaption><div class="canvas-wrap"><canvas id="edited" width="256" height="256" aria-label="Edited image"></canvas></div></figure>
      </div>
      <div class="view-options"><label><input id="overlay" type="checkbox" checked> Show control points</label><span class="point-key"><i class="locked-swatch" aria-hidden="true"></i> Locked</span><span class="point-key"><i class="editable-swatch" aria-hidden="true"></i> Editable</span></div>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
      <progress id="progress" max="1" value="0" hidden aria-label="Model download progress"></progress>
      <div class="result-tools"><button id="download" disabled>Download image</button><button id="parameters" disabled>Download parameters</button><label><input id="diff-toggle" type="checkbox"> Show difference</label></div>
      <figure id="diff-panel" hidden class="diff"><figcaption>Absolute difference (0–0.35)</figcaption><canvas id="difference" width="256" height="256" aria-label="Difference image"></canvas></figure>
    </section>
    <aside class="controls" aria-label="Editing controls">
      <h2>Controls</h2><p class="source-angles" id="source-angles">Source α — β —</p>
      <label class="field">Target α* (°)<input id="alpha" type="number" min="30" max="84" step="0.1" value="60"></label>
      <label class="check"><input id="keep-beta" type="checkbox" checked> Keep source β</label>
      <label class="field">Target β* (°)<input id="beta" type="number" min="0.1" max="89.9" step="0.1" value="60" disabled></label>
      <div class="operation"><label class="check"><input id="head-shift" type="checkbox" checked> H: Femoral-head translation</label><label class="check"><input id="head-refine" type="checkbox" checked> Boundary refinement</label><p id="delta">δ —</p></div>
      <button id="run" disabled>Run</button>
      <details class="annotations"><summary>Landmarks</summary><label class="field">Select point<select id="point-choice"><option value="0">p1 · Baseline endpoint 1</option><option value="1">p2 · Baseline endpoint 2</option><option value="2">p3 · Lower iliac limb</option><option value="3">p4 · Bony rim</option><option value="4">p5 · Labrum centre</option><option value="5">H1 · Head diameter endpoint 1</option><option value="6">H2 · Head diameter endpoint 2</option></select></label><table><thead><tr><th>Point</th><th>x (px)</th><th>y (px)</th></tr></thead><tbody id="coordinates"></tbody></table><div class="secondary-actions"><button id="clear-h">Remove H</button><button id="reset-points">Clear points</button></div></details>
    </aside>
  </div>
</main>
<script type="module" src="app.mjs"></script>
</body></html>
